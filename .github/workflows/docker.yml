name: Deploy Hop-In API to Cloud Run

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: hop-in-ridebookingwebapp
  REGION: asia-southeast1
  REPOSITORY: hop-in
  IMAGE: hop-in-api
  SERVICE: hop-in-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/228930823058/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions@hop-in-ridebookingwebapp.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build and Push API Image
        run: |
          IMAGE_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${GITHUB_SHA}"

          docker build \
            -t "$IMAGE_URI" \
            ./backend

          docker push "$IMAGE_URI"

      - name: Deploy to Cloud Run
        run: |
          IMAGE_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${GITHUB_SHA}"

          gcloud run deploy "$SERVICE" \
            --image="$IMAGE_URI" \
            --region="$REGION" \
            --platform=managed \
            --quiet