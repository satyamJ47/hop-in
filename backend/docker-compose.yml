services:

  redis:
    image: redis:7-alpine

    restart: unless-stopped

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    image: satyamworks/hop-in-api:latest
    build: .

    env_file:
      - .env

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      redis:
        condition: service_healthy

    ports:
      - "3000:3000"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    image: satyamworks/hop-in-worker:latest
    build: .

    command: npm run worker

    env_file:
      - .env

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest

    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

    env_file:
      - .env

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped

volumes:
  redis-data: